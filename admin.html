<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة - Nova State</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: #12161f; color: #e2e8f0; min-height: 100vh; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #1a2230; border-bottom: 1px solid #2a3447; }
    .top-bar h3 { color: #d4af37; font-weight: 700; }
    .user-controls { display: flex; gap: 10px; align-items: center; }
    
    .btn-action { border: 1px solid #d4af37; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; background: transparent; color: #d4af37; }
    .btn-action:hover { background: #d4af37; color: #12161f; }
    .btn-logout { border-color: #ef4444; color: #ef4444; }
    .btn-logout:hover { background: #ef4444; color: #fff; }

    .main-content { padding: 30px; max-width: 850px; margin: 0 auto; }
    .card-box { background: #1a2230; border: 1px solid #2a3447; padding: 30px; border-radius: 12px; margin-bottom: 20px; }

    .view-container { display: none; }
    .view-container.active { display: block; }

    .input-group { margin-bottom: 15px; text-align: right; }
    .input-group label { display: block; margin-bottom: 5px; color: #cbd5e1; font-weight: 600; }
    .input-group input { width: 100%; padding: 10px; background: #12161f; border: 1px solid #2a3447; border-radius: 6px; color: #fff; outline: none; }

    .btn { border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; background: #d4af37; color: #12161f; }

    .item-card { background: #12161f; padding: 15px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #2a3447; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .card-actions { display: flex; gap: 8px; align-items: center; }
    .btn-accept { background: #22c55e; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-rand { background: #3b82f6; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-delete { background: #ef4444; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .code-badge { background: #1a2230; border: 1px dashed #d4af37; color: #d4af37; padding: 3px 8px; border-radius: 4px; font-weight: 700; font-family: monospace; }

    /* التنبيه الداخلي */
    #siteToast {
      position: fixed;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      transition: all 0.4s ease;
      z-index: 9999;
      text-align: center;
    }
    #siteToast.show { bottom: 30px; }
    #siteToast.success { background: #16a34a; border: 1px solid #22c55e; }
    #siteToast.error { background: #dc2626; border: 1px solid #ef4444; }
  </style>
</head>
<body>

  <script>
    const userSession = JSON.parse(localStorage.getItem('nova_user'));
    if (!userSession) window.location.href = 'login.html';
  </script>

  <div class="top-bar">
    <h3>Nova State - الإدارة</h3>
    <div class="user-controls">
      <span id="userNameDisplay" style="color: #cbd5e1; font-weight:600;"></span>
      <button class="btn-action" onclick="showView('keysView')">🔑 إدارة الأكواد</button>
      <button class="btn-action" onclick="showView('requestsView')">🔔 طلبات الانضمام</button>
      <button class="btn-action" onclick="showView('usersView')">👥 المسجلين</button>
      <button class="btn-action btn-logout" onclick="logout()">تسجيل خروج</button>
    </div>
  </div>

  <div class="main-content">
    <div class="card-box view-container active" id="welcomeView" style="text-align: center;">
      <h1 style="color: #d4af37; margin-bottom: 10px;">مرحباً بك في لوحة الإدارة</h1>
      <p style="color: #94a3b8;">يمكنك التحكم بالطلبات، القبول، وتوليد الأكواد العشوائية بكل سهولة.</p>
    </div>

    <!-- 1. الأكواد -->
    <div class="card-box view-container" id="keysView">
      <h2 style="color: #d4af37; margin-bottom: 20px; text-align: center;">الأكواد المفعّلة</h2>
      <div class="input-group">
        <label>إنشاء كود عشوائي أو يدوي جديد:</label>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="manualKeyInput" placeholder="أدخل كود أو اتركه فارغاً لإنشاء عشوائي...">
          <button class="btn" id="generateKeyBtn">إنشاء الكود ➕</button>
        </div>
      </div>
      <div id="keysList"></div>
    </div>

    <!-- 2. الطلبات -->
    <div class="card-box view-container" id="requestsView">
      <h2 style="color: #d4af37; margin-bottom: 20px; text-align: center;">طلبات الانضمام المعلقة</h2>
      <div id="requestsList"></div>
    </div>

    <!-- 3. المستخدمين -->
    <div class="card-box view-container" id="usersView">
      <h2 style="color: #d4af37; margin-bottom: 20px; text-align: center;">المستخدمين المعتمدين</h2>
      <div id="usersList"></div>
    </div>
  </div>

  <div id="siteToast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB165FX1UTITowtK-il9rzIL_LwzfQwkpI",
      authDomain: "nova-state.firebaseapp.com",
      databaseURL: "https://nova-state-default-rtdb.firebaseio.com",
      projectId: "nova-state",
      storageBucket: "nova-state.firebasestorage.app",
      messagingSenderId: "478766533943",
      appId: "1:478766533943:web:6ce4d7cd0b1a58d72c1eb2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.getElementById('userNameDisplay').innerText = userSession.username;

    // تنبيهات داخلية في الصفحة
    window.showToast = function(msg, isSuccess = false) {
      const toast = document.getElementById('siteToast');
      toast.innerText = msg;
      toast.className = 'show ' + (isSuccess ? 'success' : 'error');
      setTimeout(() => { toast.className = ''; }, 3500);
    };

    // توليد كود عشوائي
    function generateRandomCode() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let result = 'NOVA-';
      for (let i = 0; i < 5; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    window.showView = function(viewId) {
      document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    };

    window.logout = function() {
      localStorage.removeItem('nova_user');
      window.location.href = 'login.html';
    };

    // --- الأكواد ---
    document.getElementById('generateKeyBtn').addEventListener('click', async () => {
      const inputVal = document.getElementById('manualKeyInput').value.trim();
      const keyCode = inputVal ? inputVal : generateRandomCode();

      await set(ref(db, 'keys/' + keyCode), {
        active: true,
        createdAt: new Date().toISOString()
      });
      document.getElementById('manualKeyInput').value = '';
      showToast('تمت إضافة الكود بنجاح: ' + keyCode, true);
    });

    onValue(ref(db, 'keys'), (snapshot) => {
      const list = document.getElementById('keysList');
      list.innerHTML = '';
      const data = snapshot.val();
      if (data) {
        Object.keys(data).forEach(key => {
          list.innerHTML += `
            <div class="item-card">
              <div>الكود: <span class="code-badge">${key}</span></div>
              <button class="btn-delete" onclick="deleteKey('${key}')">حذف</button>
            </div>
          `;
        });
      } else {
        list.innerHTML = '<p style="text-align:center; color:#94a3b8;">لا توجد أكواد مضافة.</p>';
      }
    });

    window.deleteKey = (key) => {
      remove(ref(db, 'keys/' + key));
      showToast('تم حذف الكود');
    };

    // --- طلبات الانضمام مع الكود العشوائي القابل للتغيير ---
    let reqCodes = {};

    onValue(ref(db, 'join_requests'), (snapshot) => {
      const list = document.getElementById('requestsList');
      list.innerHTML = '';
      const data = snapshot.val();
      if (data) {
        Object.keys(data).forEach(reqId => {
          const req = data[reqId];
          if (!reqCodes[reqId]) reqCodes[reqId] = generateRandomCode();

          list.innerHTML += `
            <div class="item-card">
              <div>
                <strong>${req.username}</strong> (${req.email})
                <br>
                <small style="color:#94a3b8;">الكود المقترح: </small>
                <span class="code-badge" id="code-tag-${reqId}">${reqCodes[reqId]}</span>
              </div>
              <div class="card-actions">
                <button class="btn-rand" onclick="randomizeCode('${reqId}')">🔄 تغيير الكود</button>
                <button class="btn-accept" onclick="acceptRequest('${reqId}', '${req.username}', '${req.email}', '${req.pass}')">قبول الطلب ✓</button>
                <button class="btn-delete" onclick="rejectRequest('${reqId}')">رفض ✕</button>
              </div>
            </div>
          `;
        });
      } else {
        list.innerHTML = '<p style="text-align:center; color:#94a3b8;">لا توجد طلبات جديدة.</p>';
      }
    });

    // إعادة تغيير الكود عشوائياً للطلب المحدد
    window.randomizeCode = (reqId) => {
      reqCodes[reqId] = generateRandomCode();
      document.getElementById('code-tag-' + reqId).innerText = reqCodes[reqId];
      showToast('تم اختيار كود عشوائي جديد!');
    };

    // قبول الطلب بالكود المختار
    window.acceptRequest = async (reqId, username, email, pass) => {
      const finalCode = reqCodes[reqId];
      const newUserId = push(ref(db, 'users')).key;

      await set(ref(db, 'users/' + newUserId), {
        username,
        email,
        pass,
        userCode: finalCode,
        role: 'member',
        createdAt: new Date().toISOString()
      });

      await set(ref(db, 'keys/' + finalCode), { active: true });
      await remove(ref(db, 'join_requests/' + reqId));

      delete reqCodes[reqId];
      showToast(`تم قبول الحساب بالكود: ${finalCode}`, true);
    };

    window.rejectRequest = (reqId) => {
      remove(ref(db, 'join_requests/' + reqId));
      showToast('تم رفض الطلب');
    };

    // --- المسجلين ---
    onValue(ref(db, 'users'), (snapshot) => {
      const list = document.getElementById('usersList');
      list.innerHTML = '';
      const data = snapshot.val();
      if (data) {
        Object.keys(data).forEach(userId => {
          const u = data[userId];
          list.innerHTML += `
            <div class="item-card">
              <div>
                <strong>${u.username}</strong> | الكود المفعل: <span class="code-badge">${u.userCode || 'لا يوجد'}</span>
              </div>
              <button class="btn-delete" onclick="deleteUser('${userId}')">حذف الحساب</button>
            </div>
          `;
        });
      } else {
        list.innerHTML = '<p style="text-align:center; color:#94a3b8;">لا يوجد مستخدمين مقبولين.</p>';
      }
    });

    window.deleteUser = (userId) => {
      remove(ref(db, 'users/' + userId));
      showToast('تم حذف الحساب');
    };
  </script>
</body>
</html>
