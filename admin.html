<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة - Admin Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; margin-bottom: 5px; color: #94a3b8; font-size: 14px; }
    .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; }
    .btn { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; margin-top: 10px; }
    .btn:hover { background: #0369a1; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    .btn-success { background: #10b981; }
    .btn-success:hover { background: #059669; }
    .btn-secondary { background: #475569; }
    .switch-link { text-align: center; margin-top: 15px; font-size: 14px; color: #38bdf8; cursor: pointer; text-decoration: underline; }
    
    /* Fullscreen Overlay Views */
    .fullscreen-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0f172a; z-index: 100; display: none; flex-direction: column; padding: 30px; overflow-y: auto; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #334155; padding-bottom: 15px; }
    .back-btn { position: absolute; top: 20px; right: 20px; width: auto; padding: 10px 20px; }
    
    .list-item { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #334155; }
    .item-info { display: flex; gap: 20px; font-size: 16px; font-weight: bold; color: #e2e8f0; flex-wrap: wrap; }
    .actions { display: flex; gap: 10px; margin-top: 10px; }
    .checkbox-group { display: flex; gap: 15px; align-items: center; background: #0f172a; padding: 10px; border-radius: 6px; }

    /* Custom Toast Notification */
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #38bdf8; color: #0f172a; padding: 12px 24px; border-radius: 8px; font-weight: bold; display: none; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
  </style>
</head>
<body>

  <div id="toast"></div>

  <!-- Login Form -->
  <div id="loginForm" class="card">
    <h2>تسجيل الدخول</h2>
    <div class="input-group">
      <label>اسم المستخدم (User Name)</label>
      <input type="text" id="loginUser">
    </div>
    <div class="input-group">
      <label>كلمة المرور (Pass)</label>
      <input type="password" id="loginPass">
    </div>
    <button class="btn" onclick="login()">دخول</button>
    <div class="switch-link" onclick="showRegister()">إنشاء طلب دخول</div>
  </div>

  <!-- Register Form -->
  <div id="registerForm" class="card" style="display:none;">
    <h2>إنشاء طلب دخول</h2>
    <div class="input-group">
      <label>User Name</label>
      <input type="text" id="regUser">
    </div>
    <div class="input-group">
      <label>Nikname</label>
      <input type="text" id="regNick">
    </div>
    <div class="input-group">
      <label>Pass</label>
      <input type="password" id="regPass">
    </div>
    <button class="btn btn-success" onclick="requestAccess()">إرسال الطلب</button>
    <div class="switch-link" onclick="showLogin()">لديك حساب بالفعل؟ سجل دخول</div>
  </div>

  <!-- Dashboard Main -->
  <div id="dashboard" class="card" style="display:none; max-width: 600px;">
    <h2>مرحباً، <span id="userNickname"></span></h2>
    <div id="adminButtons" style="display: flex; flex-direction: column; gap: 15px;">
      <button id="btnRequests" class="btn" style="display:none;" onclick="openOverlay('requestsOverlay')">قبول طلبات إدارية</button>
      <button id="btnMakeCode" class="btn btn-success" style="display:none;" onclick="generateCode()">عمل كود</button>
      <button id="btnCodesList" class="btn btn-secondary" style="display:none;" onclick="openOverlay('codesOverlay')">قائمة الأكواد</button>
      <button id="btnOwnerStaff" class="btn btn-danger" style="display:none;" onclick="openOverlay('staffOverlay')">مسؤول الطاقم الإداري (مزاج)</button>
      <button class="btn btn-danger" onclick="logout()">تسجيل خروج</button>
    </div>
  </div>

  <!-- Overlay: Requests -->
  <div id="requestsOverlay" class="fullscreen-overlay">
    <div class="top-bar">
      <h2>طلبات الانضمام الإدارية</h2>
      <button class="btn btn-secondary back-btn" onclick="closeOverlay('requestsOverlay')">رجوع ➔</button>
    </div>
    <div id="requestsList"></div>
  </div>

  <!-- Overlay: Staff Management (Owner) -->
  <div id="staffOverlay" class="fullscreen-overlay">
    <div class="top-bar">
      <h2>إدارة الطاقم الإداري</h2>
      <button class="btn btn-secondary back-btn" onclick="closeOverlay('staffOverlay')">رجوع ➔</button>
    </div>
    <div id="staffList"></div>
  </div>

  <!-- Overlay: Codes List -->
  <div id="codesOverlay" class="fullscreen-overlay">
    <div class="top-bar">
      <h2>قائمة الأكواد المفعلة</h2>
      <button class="btn btn-secondary back-btn" onclick="closeOverlay('codesOverlay')">رجوع ➔</button>
    </div>
    <div id="codesList"></div>
  </div>

  <!-- Firebase Integration -->
  <script type="module">
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyB165FX1UTITowtK-il9rzIL_LwzfQwkpI",
  authDomain: "nova-state.firebaseapp.com",
  databaseURL: "https://nova-state-default-rtdb.firebaseio.com",
  projectId: "nova-state",
  storageBucket: "nova-state.firebasestorage.app",
  messagingSenderId: "478766533943",
  appId: "1:478766533943:web:6ce4d7cd0b1a58d72c1eb2",
  measurementId: "G-LMCRPZT1DV"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app); 

    let currentUser = null;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    // Initialize Owner Account Automatically
    const ownerRef = ref(db, 'users/admin_manger');
    get(ownerRef).then((snapshot) => {
      if (!snapshot.exists()) {
        set(ownerRef, {
          username: "admin_manger",
          nickname: "مزاج",
          pass: "admin_manger@!",
          role: "owner",
          perms: { accept_req: true, make_code: true }
        });
      }
    });

    window.showRegister = () => {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('registerForm').style.display = 'block';
    };

    window.showLogin = () => {
      document.getElementById('registerForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
    };

    window.requestAccess = async () => {
      const u = document.getElementById('regUser').value.trim();
      const n = document.getElementById('regNick').value.trim();
      const p = document.getElementById('regPass').value.trim();

      if(!u || !n || !p) return showToast('يرجى ملء كافة الحقول');

      const userCheck = await get(child(ref(db), `users/${u}`));
      const reqCheck = await get(child(ref(db), `requests/${u}`));

      if(userCheck.exists() || reqCheck.exists()) {
        return showToast('اسم المستخدم موجود بالفعل');
      }

      await set(ref(db, 'requests/' + u), { username: u, nickname: n, pass: p });
      showToast('تم إرسال طلبك بنجاح! بانتظار موافقة الإدارة');
      showLogin();
    };

    window.login = async () => {
      const u = document.getElementById('loginUser').value.trim();
      const p = document.getElementById('loginPass').value.trim();

      const snap = await get(child(ref(db), `users/${u}`));
      if(snap.exists() && snap.val().pass === p) {
        currentUser = snap.val();
        startRealtimeUserListener(u);
        loadDashboard();
      } else {
        showToast('خطأ في اسم المستخدم أو كلمة المرور');
      }
    };

    function startRealtimeUserListener(username) {
      onValue(ref(db, `users/${username}`), (snapshot) => {
        if(!snapshot.exists()) {
          showToast('لقد تم حذف حسابك من الخدمة');
          setTimeout(() => location.reload(), 1500);
          return;
        }
        currentUser = snapshot.val();
        updateUIByPermissions();
      });
    }

    function loadDashboard() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('userNickname').innerText = currentUser.nickname;
      updateUIByPermissions();
      listenToRequests();
      listenToStaff();
      listenToCodes();
    }

    function updateUIByPermissions() {
      const perms = currentUser.perms || {};
      document.getElementById('btnRequests').style.display = (currentUser.role === 'owner' || perms.accept_req) ? 'block' : 'none';
      document.getElementById('btnMakeCode').style.display = (currentUser.role === 'owner' || perms.make_code) ? 'block' : 'none';
      document.getElementById('btnCodesList').style.display = (currentUser.role === 'owner' || perms.make_code) ? 'block' : 'none';
      document.getElementById('btnOwnerStaff').style.display = (currentUser.role === 'owner') ? 'block' : 'none';
    }

    window.openOverlay = (id) => document.getElementById(id).style.display = 'flex';
    window.closeOverlay = (id) => document.getElementById(id).style.display = 'none';

    // Requests Handling
    function listenToRequests() {
      onValue(ref(db, 'requests'), (snapshot) => {
        const container = document.getElementById('requestsList');
        container.innerHTML = '';
        if(!snapshot.exists()) {
          container.innerHTML = '<p style="color:#94a3b8">لا توجد طلبات معلقة</p>';
          return;
        }
        snapshot.forEach((childSnap) => {
          const req = childSnap.val();
          const div = document.createElement('div');
          div.className = 'list-item';
          div.innerHTML = `
            <div class="item-info">
              <span>User Name: ${req.username}</span>
              <span>Nikname: ${req.nickname}</span>
              <span>Pass: ${req.pass}</span>
            </div>
            <div class="actions">
              <button class="btn btn-success" style="width:auto;" onclick="acceptRequest('${req.username}', '${req.nickname}', '${req.pass}')">قبول</button>
              <button class="btn btn-danger" style="width:auto;" onclick="rejectRequest('${req.username}')">رفض</button>
            </div>
          `;
          container.appendChild(div);
        });
      });
    }

    window.acceptRequest = async (u, n, p) => {
      const canGrantReq = currentUser.role === 'owner';
      await set(ref(db, `users/${u}`), {
        username: u,
        nickname: n,
        pass: p,
        role: 'admin',
        perms: {
          accept_req: canGrantReq,
          make_code: true
        }
      });
      await remove(ref(db, `requests/${u}`));
      showToast('تم قبول الطلب');
    };

    window.rejectRequest = async (u) => {
      await remove(ref(db, `requests/${u}`));
      showToast('تم رفض الطلب');
    };

    // Staff Handling (Owner Only)
    function listenToStaff() {
      onValue(ref(db, 'users'), (snapshot) => {
        const container = document.getElementById('staffList');
        container.innerHTML = '';
        snapshot.forEach((childSnap) => {
          const u = childSnap.val();
          if(u.username === 'admin_manger') return;
          
          const div = document.createElement('div');
          div.className = 'list-item';
          div.innerHTML = `
            <div class="item-info">
              <span>User Name: ${u.username}</span>
              <span>Nikname: ${u.nickname}</span>
              <span>Pass: ${u.pass}</span>
            </div>
            <div class="checkbox-group">
              <label>الصلاحيات:</label>
              <label><input type="checkbox" id="p_req_${u.username}" ${u.perms?.accept_req ? 'checked' : ''}> قبول طلبات</label>
              <label><input type="checkbox" id="p_code_${u.username}" ${u.perms?.make_code ? 'checked' : ''}> عمل كود</label>
            </div>
            <div class="actions">
              <button class="btn" style="width:auto;" onclick="updatePerms('${u.username}')">تعديل الصلاحيات</button>
              <button class="btn btn-danger" style="width:auto;" onclick="deleteAccount('${u.username}')">حذف الحساب</button>
            </div>
          `;
          container.appendChild(div);
        });
      });
    }

    window.updatePerms = async (u) => {
      const pReq = document.getElementById(`p_req_${u}`).checked;
      const pCode = document.getElementById(`p_code_${u}`).checked;
      await update(ref(db, `users/${u}/perms`), { accept_req: pReq, make_code: pCode });
      showToast('تم تعديل الصلاحيات بنجاح');
    };

    window.deleteAccount = async (u) => {
      await remove(ref(db, `users/${u}`));
      showToast('تم حذف الحساب');
    };

    // Codes Management
    window.generateCode = async () => {
      const code = 'SMART-' + Math.random().toString(36).substring(2, 8).toUpperCase();
      await set(ref(db, `codes/${code}`), { code: code, ip: null, createdBy: currentUser.username });
      showToast(`تم إنشاء الكود: ${code}`);
    };

    function listenToCodes() {
      onValue(ref(db, 'codes'), (snapshot) => {
        const container = document.getElementById('codesList');
        container.innerHTML = '';
        if(!snapshot.exists()) {
          container.innerHTML = '<p style="color:#94a3b8">لا توجد أكواد حالية</p>';
          return;
        }
        snapshot.forEach((childSnap) => {
          const c = childSnap.val();
          const div = document.createElement('div');
          div.className = 'list-item';
          div.innerHTML = `
            <div class="item-info">
              <span>الكود: <strong style="color:#38bdf8">${c.code}</strong></span>
              <span>IP المسجل: ${c.ip ? c.ip : 'لم يسجل بعد'}</span>
            </div>
            <div class="actions">
              <button class="btn btn-danger" style="width:auto;" onclick="deleteCode('${c.code}')">حذف الكود</button>
            </div>
          `;
          container.appendChild(div);
        });
      });
    }

    window.deleteCode = async (c) => {
      await remove(ref(db, `codes/${c}`));
      showToast('تم حذف الكود');
    };

    window.logout = () => location.reload();
  </script>
</body>
</html>
