<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة الأساسية - Nova State</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: #12161f; color: #e2e8f0; min-height: 100vh; }
    
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: #1a2230;
      border-bottom: 1px solid #2a3447;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .top-bar h3 { color: #d4af37; font-weight: 700; }
    .user-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    
    .btn-action { 
      border: 1px solid #d4af37; 
      padding: 8px 16px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 600; 
      font-family: 'Cairo', sans-serif; 
      transition: 0.2s ease;
      background: transparent;
      color: #d4af37;
      font-size: 0.9rem;
    }
    .btn-action:hover { background: #d4af37; color: #12161f; }
    .btn-logout { border-color: #ef4444; color: #ef4444; }
    .btn-logout:hover { background: #ef4444; color: #ffffff; }

    .main-content { padding: 30px; max-width: 800px; margin: 0 auto; }
    .card-box { background: #1a2230; border: 1px solid #2a3447; padding: 30px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .permissions-badge { display: inline-block; background: #12161f; border: 1px solid #2a3447; padding: 6px 12px; border-radius: 20px; margin: 5px; font-size: 0.9rem; color: #38bdf8; }

    .view-container { display: none; }
    .view-container.active { display: block; }

    .input-group { margin-bottom: 15px; text-align: right; }
    .input-group label { display: block; margin-bottom: 5px; color: #cbd5e1; font-weight: 600; }
    .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 10px; background: #12161f; border: 1px solid #2a3447; border-radius: 6px; color: #fff; outline: none; }
    .input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-color: #d4af37; }
    
    .input-group textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.8;
      font-size: 1rem;
      white-space: pre-wrap;
    }
    
    .btn { border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; background: #d4af37; color: #12161f; font-family: 'Cairo', sans-serif; transition: 0.2s; width: 100%; margin-top: 5px; }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: #3b82f6; color: #fff; }

    .list-container { margin-top: 15px; max-height: 400px; overflow-y: auto; padding-left: 5px; }
    .item-card { background: #12161f; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #2a3447; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    
    .card-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn-accept { background: #22c55e; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-delete { background: #ef4444; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-edit { background: #3b82f6; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #1a2230; padding: 25px; border-radius: 12px; width: 90%; max-width: 600px; border: 1px solid #2a3447; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .modal-content h3 { color: #d4af37; margin-bottom: 15px; text-align: center; }

    .permission-checkboxes { display: flex; flex-direction: column; gap: 10px; background: #12161f; padding: 15px; border-radius: 8px; border: 1px solid #2a3447; margin: 15px 0; text-align: right; }
    .permission-checkboxes label { color: #e2e8f0; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .permission-checkboxes input { width: 18px; height: 18px; accent-color: #d4af37; cursor: pointer; }
  </style>
</head>
<body>

  <div class="top-bar">
    <h3>لوحة الإدارة الأساسية</h3>
    <div class="user-controls">
      <span style="font-weight: 600; color: #cbd5e1;">المدير العام</span>
      <button class="btn-action" onclick="showView('keysView')">🔑 إدارة الأكواد</button>
      <button class="btn-action" onclick="showView('requestsView')">🔔 الطلبات</button>
      <button class="btn-action" onclick="showView('manageUsersView')">👥 المستخدمين</button>
      <button class="btn-action btn-logout" onclick="logout()">خروج</button>
    </div>
  </div>

  <div class="main-content">
    <div class="card-box view-container active" id="welcomeView" style="text-align: center;">
      <h1 style="color: #d4af37; margin-bottom: 10px;">مرحباً بك في لوحة الإدارة</h1>
      <p style="color: #94a3b8;">نظام إدارة المشتركين والأكواد الخاصة بـ Nova State.</p>
    </div>

    <!-- واجهة إدارة الأكواد المحدثة -->
    <div class="card-box view-container" id="keysView">
      <h2 style="color: #d4af37; margin-bottom: 20px; text-align: center;">إدارة الأكواد</h2>
      
      <!-- قسم التوليد التلقائي السريع مع تحديد المدة -->
      <div style="background: #12161f; padding: 15px; border-radius: 8px; border: 1px solid #2a3447; margin-bottom: 20px;">
        <h3 style="color: #38bdf8; font-size: 1rem; margin-bottom: 10px; text-align: right;">توليد كود عشوائي تلقائياً (NOVA-XXXXX)</h3>
        <div class="input-group">
          <label>المدة المحددة لهذا الكود (بالأيام):</label>
          <input type="number" id="generatedDuration" value="30" min="1">
        </div>
        <button class="btn btn-secondary" id="generateAndSaveBtn">⚡ توليد كود عشوائي وحفظه فوراً بالمدة المحددة</button>
      </div>

      <div class="input-group">
        <label>أو إضافة أكواد متعددة يدوياً (كل كود في سطر - تدعم السطور الكثيرة بدون تعليق):</label>
        <textarea id="newKeyInput" placeholder="NOVA-A1B2C&#10;NOVA-D3E4F"></textarea>
      </div>
      
      <div class="input-group">
        <label>مدة الصلاحية للأكواد اليدوية المكتوبة بالأعلى (بالأيام):</label>
        <input type="number" id="manualDurationDays" value="30" min="1">
      </div>

      <button class="btn" id="addKeyBtn">إضافة الأكواد اليدوية لقاعدة البيانات</button>
      
      <div class="list-container" id="keysList"></div>
    </div>

    <div class="card-box view-container" id="requestsView">
      <h2 style="color: #d4af37; margin-bottom: 20px; text-align: center;">طلبات الانضمام المعلقة</h2>
      <div class="list-container" id="requestsList">
        <p style="text-align:center; color:#94a3b8;">لا توجد طلبات جديدة.</p>
      </div>
    </div>

    <div class="card-box view-container" id="manageUsersView">
      <h2 style="color: #d4af37; margin-bottom: 20px; text-align: center;">المسؤولين والأعضاء</h2>
      <div class="list-container" id="usersList"></div>
    </div>
  </div>

  <div id="editPermissionsModal" class="modal">
    <div class="modal-content" style="max-width: 450px;">
      <h3>تعديل صلاحيات العضو</h3>
      <p id="editUsernameTarget" style="text-align:center; color:#38bdf8; margin-bottom:10px; font-weight:600;"></p>
      <div class="permission-checkboxes">
        <label><input type="checkbox" id="editPermNotifications"> قبول الطلبات</label>
        <label><input type="checkbox" id="editPermManageKeys"> إدارة الأكواد</label>
        <label><input type="checkbox" id="editPermCreateAccount"> إنشاء حسابات</label>
      </div>
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="btn" style="background:#22c55e; color:#fff; margin-top:0;" onclick="saveUserPermissions()">حفظ ✓</button>
        <button class="btn" style="background:#ef4444; color:#fff; margin-top:0;" onclick="closeModal('editPermissionsModal')">إلغاء ✕</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, remove, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB165FX1UTITowtK-il9rzIL_LwzfQwkpI",
      authDomain: "nova-state.firebaseapp.com",
      databaseURL: "https://nova-state-default-rtdb.firebaseio.com",
      projectId: "nova-state",
      storageBucket: "nova-state.firebasestorage.app",
      messagingSenderId: "478766533943",
      appId: "1:478766533943:web:6ce4d7cd0b1a58d72c1eb2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let currentEditingUserKey = null;

    window.showView = function(viewId) {
      document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    };

    window.closeModal = function(modalId) {
      document.getElementById(modalId).style.display = 'none';
    };

    window.logout = function() {
      alert("تم تسجيل الخروج بنجاح.");
      window.location.reload();
    };

    // دالة لتوليد الكود بالصيغة NOVA-XXXXX
    function generateNovaCode() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let randomPart = '';
      for (let i = 0; i < 5; i++) {
        randomPart += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return `NOVA-${randomPart}`;
    }

    // زر التوليد التلقائي الفوري وحفظه مع إظهار النتيجة والمدة
    document.getElementById("generateAndSaveBtn").addEventListener("click", async () => {
      const durationDays = parseInt(document.getElementById("generatedDuration").value) || 30;
      const newCode = generateNovaCode();
      const expireAt = Date.now() + (durationDays * 24 * 60 * 60 * 1000);

      try {
        await set(ref(db, 'keys/' + newCode), {
          active: true,
          createdAt: Date.now(),
          durationDays: durationDays,
          expireAt: expireAt
        });
        alert(`تم توليد الكود بنجاح وإنشاؤه في قاعدة البيانات!\n\nالكود: ${newCode}\nالمدة: ${durationDays} يوم`);
      } catch (err) {
        console.error(err);
        alert("حدث خطأ أثناء حفظ الكود.");
      }
    });

    // إضافة الأكواد المتعددة يدوياً
    document.getElementById("addKeyBtn").addEventListener("click", async () => {
      const textContent = document.getElementById("newKeyInput").value;
      const durationDays = parseInt(document.getElementById("manualDurationDays").value) || 30;
      
      if (!textContent.trim()) return alert("يرجى كتابة أو لصق الأكواد في الصندوق!");

      const lines = textContent.split(/\r?\n/);
      let addedCount = 0;
      const expireAt = Date.now() + (durationDays * 24 * 60 * 60 * 1000);

      try {
        for (let line of lines) {
          const cleanKey = line.trim();
          if (cleanKey) {
            await set(ref(db, 'keys/' + cleanKey), { 
              active: true, 
              createdAt: Date.now(),
              durationDays: durationDays,
              expireAt: expireAt
            });
            addedCount++;
          }
        }
        document.getElementById("newKeyInput").value = "";
        alert(`تم إضافة ${addedCount} كود بنجاح لمدة ${durationDays} يوم!`);
      } catch (err) {
        alert("حدث خطأ أثناء الاتصال بقاعدة البيانات.");
      }
    });

    onValue(ref(db, 'keys'), (snapshot) => {
      const keysList = document.getElementById("keysList");
      keysList.innerHTML = "";
      const data = snapshot.val();
      if (data) {
        Object.keys(data).forEach(key => {
          const keyData = data[key];
          const daysLeft = keyData.expireAt ? Math.ceil((keyData.expireAt - Date.now()) / (1000 * 60 * 60 * 24)) : 'غير محدد';
          
          const item = document.createElement("div");
          item.className = "item-card";
          item.innerHTML = `
            <div>
              <strong>الكود:</strong> ${key}<br>
              <span style="font-size: 0.8rem; color: #38bdf8;">الصلاحية: ${daysLeft > 0 ? daysLeft + ' يوم' : 'منتهي الصلاحية'}</span><br>
              <span style="font-size: 0.8rem; color: ${keyData.boundIP ? '#22c55e' : '#94a3b8'};">${keyData.boundIP ? '🔒 مرتبط بجهاز: ' + keyData.boundIP : '🔓 غير مرتبط بأي جهاز بعد'}</span>
            </div>
            <div class="card-actions">
              ${keyData.boundIP ? `<button class="btn-edit" onclick="unbindKey('${key}')">فك الربط</button>` : ''}
              <button class="btn-delete" onclick="deleteKey('${key}')">حذف</button>
            </div>
          `;
          keysList.appendChild(item);
        });
      } else {
        keysList.innerHTML = `<p style="text-align:center; color:#94a3b8;">لا توجد أكواد مضافة حالياً.</p>`;
      }
    });

    window.deleteKey = async (key) => {
      if (confirm(`هل أنت متأكد من حذف الكود: ${key}؟`)) {
        await remove(ref(db, 'keys/' + key));
      }
    };

    window.unbindKey = async (key) => {
      if (confirm(`هل تريد فك ربط الكود "${key}" من جهازه الحالي؟ سيتمكن أي جهاز من استخدامه أول مرة بعد ذلك.`)) {
        await update(ref(db, 'keys/' + key), { boundIP: null });
      }
    };

    onValue(ref(db, 'requests'), (snapshot) => {
      const requestsList = document.getElementById("requestsList");
      requestsList.innerHTML = "";
      const data = snapshot.val();
      if (data) {
        Object.keys(data).forEach(reqId => {
          const reqData = data[reqId];
          const item = document.createElement("div");
          item.className = "item-card";
          item.innerHTML = `
            <div>
              <strong>المستخدم:</strong> ${reqData.username || reqId}<br>
              <span style="font-size: 0.85rem; color: #94a3b8;">الكود: ${reqData.code || 'غير متوفر'}</span>
            </div>
            <div class="card-actions">
              <button class="btn-accept" onclick="acceptRequest('${reqId}', '${reqData.username || reqId}')">قبول</button>
              <button class="btn-delete" onclick="deleteRequest('${reqId}')">رفض</button>
            </div>
          `;
          requestsList.appendChild(item);
        });
      } else {
        requestsList.innerHTML = `<p style="text-align:center; color:#94a3b8;">لا توجد طلبات جديدة.</p>`;
      }
    });

    window.acceptRequest = async (reqId, username) => {
      await set(ref(db, 'users/' + reqId), { username, role: 'member', joinedAt: Date.now() });
      await remove(ref(db, 'requests/' + reqId));
      alert(`تم قبول المستخدم ${username} بنجاح.`);
    };

    window.deleteRequest = async (reqId) => {
      if (confirm("هل أنت متأكد من الرفض؟")) await remove(ref(db, 'requests/' + reqId));
    };

    onValue(ref(db, 'users'), (snapshot) => {
      const usersList = document.getElementById("usersList");
      usersList.innerHTML = "";
      const data = snapshot.val();
      if (data) {
        Object.keys(data).forEach(userKey => {
          const user = data[userKey];
          const item = document.createElement("div");
          item.className = "item-card";
          item.innerHTML = `
            <div><strong>${user.username || userKey}</strong></div>
            <div class="card-actions">
              <button class="btn-edit" onclick="openEditPermissions('${userKey}', '${user.username || userKey}')">الصلاحيات</button>
              <button class="btn-delete" onclick="deleteUser('${userKey}')">حذف</button>
            </div>
          `;
          usersList.appendChild(item);
        });
      } else {
        usersList.innerHTML = `<p style="text-align:center; color:#94a3b8;">لا توجد حسابات مسجلة.</p>`;
      }
    });

    window.openEditPermissions = function(userKey, username) {
      currentEditingUserKey = userKey;
      document.getElementById('editUsernameTarget').innerText = `المستخدم: ${username}`;
      onValue(ref(db, `users/${userKey}/permissions`), (snapshot) => {
        const perms = snapshot.val() || {};
        document.getElementById('editPermNotifications').checked = !!perms.notifications;
        document.getElementById('editPermManageKeys').checked = !!perms.manageKeys;
        document.getElementById('editPermCreateAccount').checked = !!perms.createAccount;
      }, { onlyOnce: true });
      document.getElementById('editPermissionsModal').style.display = 'flex';
    };

    window.saveUserPermissions = async function() {
      if (!currentEditingUserKey) return;
      const newPerms = {
        notifications: document.getElementById('editPermNotifications').checked,
        manageKeys: document.getElementById('editPermManageKeys').checked,
        createAccount: document.getElementById('editPermCreateAccount').checked
      };
      await update(ref(db, `users/${currentEditingUserKey}/permissions`), newPerms);
      closeModal('editPermissionsModal');
      alert("تم الحفظ بنجاح!");
    };

    window.deleteUser = async (userKey) => {
      if (confirm("هل أنت متأكد من الحذف؟")) await remove(ref(db, 'users/' + userKey));
    };

document.addEventListener('contextmenu', event => event.preventDefault());

    document.onkeydown = function(e) {
        // منع F12
        if (e.keyCode == 123) {
            return false;
        }
        // منع Ctrl+Shift+I (Inspect)
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) {
            return false;
        }
        // منع Ctrl+Shift+C (Inspect Element)
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) {
            return false;
        }
        // منع Ctrl+Shift+J (Console)
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) {
            return false;
        }
        // منع Ctrl+U (View Source)
        if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) {
            return false;
        }
        // منع Ctrl+S (Save Page)
        if (e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) {
            return false;
        }
    };

  </script>
</body>
</html>
