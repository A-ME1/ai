<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة الأساسية - Nova State</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: #12161f; color: #e2e8f0; min-height: 100vh; }
    
    /* الشريط العلوي */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: #1a2230;
      border-bottom: 1px solid #2a3447;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .top-bar h3 { color: #d4af37; font-weight: 700; }
    .user-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    
    /* الأزرار العلوية الذهبية الحواف */
    .btn-action { 
      border: 1px solid #d4af37; 
      padding: 8px 16px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 600; 
      font-family: 'Cairo', sans-serif; 
      transition: 0.2s ease;
      background: transparent;
      color: #d4af37;
      font-size: 0.9rem;
    }
    .btn-action:hover { 
      background: #d4af37; 
      color: #12161f; 
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }

    /* زر الخروج الاحمر */
    .btn-logout { 
      border-color: #ef4444; 
      color: #ef4444; 
      background: transparent;
    }
    .btn-logout:hover { 
      background: #ef4444; 
      color: #ffffff; 
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
    }

    /* المحتوى الرئيسي */
    .main-content { padding: 30px; max-width: 800px; margin: 0 auto; }
    .card-box { background: #1a2230; border: 1px solid #2a3447; padding: 30px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .permissions-badge { display: inline-block; background: #12161f; border: 1px solid #2a3447; padding: 6px 12px; border-radius: 20px; margin: 5px; font-size: 0.9rem; color: #38bdf8; }

    /* تبديل الواجهات */
    .view-container { display: none; }
    .view-container.active { display: block; }

    /* حقول الإدخال */
    .input-group { margin-bottom: 15px; text-align: right; }
    .input-group label { display: block; margin-bottom: 5px; color: #cbd5e1; font-weight: 600; }
    .input-group input, .input-group select { width: 100%; padding: 10px; background: #12161f; border: 1px solid #2a3447; border-radius: 6px; color: #fff; outline: none; }
    .input-group input:focus, .input-group select:focus { border-color: #d4af37; }
    
    .btn { border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; background: #d4af37; color: #12161f; font-family: 'Cairo', sans-serif; transition: 0.2s; }
    .btn:hover { opacity: 0.9; }

    /* القوائم والبطاقات */
    .list-container { margin-top: 15px; }
    .item-card { background: #12161f; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #2a3447; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    
    .card-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn-accept { background: #22c55e; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-delete { background: #ef4444; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-edit { background: #3b82f6; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }

    /* النوافذ المنبثقة العامة */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #1a2230; padding: 25px; border-radius: 12px; width: 90%; max-width: 600px; border: 1px solid #2a3447; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .modal-content h3 { color: #d4af37; margin-bottom: 15px; text-align: center; }

    /* تخصيص صلاحيات الخيارات */
    .permission-checkboxes { display: flex; flex-direction: column; gap: 10px; background: #12161f; padding: 15px; border-radius: 8px; border: 1px solid #2a3447; margin: 15px 0; text-align: right; }
    .permission-checkboxes label { color: #e2e8f0; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .permission-checkboxes input { width: 18px; height: 18px; accent-color: #d4af37; cursor: pointer; }

    /* التنبيهات */
    #alertBox { display: none; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: 600; font-size: 0.9rem; }
  </style>
</head>
<body>

  <!-- الشريط العلوي -->
  <div class="top-bar">
    <h3>لوحة الإدارة الأساسية</h3>
    <div class="user-controls">
      <span id="userNameDisplay" style="font-weight: 600; color: #cbd5e1;">المدير العام</span>
      
      <button class="btn-action" onclick="showView('keysView')">🔑 إدارة أكواد المشتركين</button>
      <button class="btn-action" onclick="showView('requestsView')">🔔 قبول الطلبات</button>
      <button class="btn-action" onclick="showView('manageUsersView')">👥 مسؤول الإدارة</button>
      
      <button class="btn-action btn-logout" onclick="logout()">تسجيل خروج</button>
    </div>
  </div>

  <!-- المحتوى الرئيسي -->
  <div class="main-content">
    <div id="alertBox"></div>

    <!-- 1. واجهة الترحيب الأساسية -->
    <div class="card-box view-container active" id="welcomeView" style="text-align: center;">
      <h1 style="color: #d4af37; margin-bottom: 10px;">مرحباً بك في لوحة الإدارة</h1>
      <p style="color: #94a3b8; margin-bottom: 15px;">نظام إدارة المشتركين والأكواد الخاصة بـ Nova State.</p>
    </div>

    <!-- 2. واجهة إدارة الأكواد -->
    <div class="card-box view-container" id="keysView">
      <h2 style="color: #d4af37; margin-bottom: 20px; text-align: center;">إدارة الأكواد</h2>
      <div class="input-group">
        <label>إضافة كود جديد:</label>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="newKeyInput" placeholder="أدخل الكود الجديد..." autocomplete="off">
          <button class="btn" id="addKeyBtn">إضافة الكود</button>
        </div>
      </div>
      <div class="list-container" id="keysList">
        <!-- الأكواد سيتم تحميلها هنا -->
      </div>
    </div>

    <!-- 3. واجهة قبول طلبات الانضمام -->
    <div class="card-box view-container" id="requestsView">
      <h2 style="color: #d4af37; margin-bottom: 20px; text-align: center;">طلبات الانضمام المعلقة</h2>
      <div class="list-container" id="requestsList">
        <p style="text-align:center; color:#94a3b8;">لا توجد طلبات جديدة حالياً.</p>
      </div>
    </div>

    <!-- 4. واجهة إدارة المستخدمين -->
    <div class="card-box view-container" id="manageUsersView">
      <h2 style="color: #d4af37; margin-bottom: 20px; text-align: center;">المسؤولين والأعضاء</h2>
      <div class="list-container" id="usersList">
        <!-- مستخدمي النظام -->
      </div>
    </div>
  </div>

  <!-- نافذة تعديل الصلاحيات -->
  <div id="editPermissionsModal" class="modal">
    <div class="modal-content" style="max-width: 450px;">
      <h3>تعديل صلاحيات العضو</h3>
      <p id="editUsernameTarget" style="text-align:center; color:#38bdf8; margin-bottom:10px; font-weight:600;"></p>
      <div class="permission-checkboxes">
        <label><input type="checkbox" id="editPermNotifications"> صلاحية القبول (قبول الطلبات)</label>
        <label><input type="checkbox" id="editPermManageKeys"> صلاحية إدارة الأكواد</label>
        <label><input type="checkbox" id="editPermCreateAccount"> صلاحية إنشاء حسابات جديدة</label>
      </div>
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="btn" style="flex:1; background:#22c55e; color:#fff;" onclick="saveUserPermissions()">حفظ التعديلات ✓</button>
        <button class="btn" style="flex:1; background:#ef4444; color:#fff;" onclick="closeModal('editPermissionsModal')">إلغاء ✕</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, remove, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB165FX1UTITowtK-il9rzIL_LwzfQwkpI",
      authDomain: "nova-state.firebaseapp.com",
      databaseURL: "https://nova-state-default-rtdb.firebaseio.com",
      projectId: "nova-state",
      storageBucket: "nova-state.firebasestorage.app",
      messagingSenderId: "478766533943",
      appId: "1:478766533943:web:6ce4d7cd0b1a58d72c1eb2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentEditingUserKey = null;

    // التنقل بين الواجهات
    window.showView = function(viewId) {
      document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
      const targetView = document.getElementById(viewId);
      if(targetView) targetView.classList.add('active');
    };

    window.closeModal = function(modalId) {
      document.getElementById(modalId).style.display = 'none';
    };

    window.logout = function() {
      alert("تم تسجيل الخروج بنجاح.");
      window.location.reload();
    };

    // --- 1. إدارة الأكواد ---
    const addKeyBtn = document.getElementById("addKeyBtn");
    const newKeyInput = document.getElementById("newKeyInput");
    const keysList = document.getElementById("keysList");

    addKeyBtn.addEventListener("click", async () => {
      const newKey = newKeyInput.value.trim();
      if (!newKey) return alert("يرجى إدخال كود صحيح!");

      try {
        await set(ref(db, 'keys/' + newKey), { active: true, createdAt: Date.now() });
        newKeyInput.value = "";
      } catch (err) {
        console.error("Error adding key:", err);
      }
    });

    onValue(ref(db, 'keys'), (snapshot) => {
      keysList.innerHTML = "";
      const data = snapshot.val();
      if (data) {
        Object.keys(data).forEach(key => {
          const item = document.createElement("div");
          item.className = "item-card";
          item.innerHTML = `
            <div><strong>الكود:</strong> ${key}</div>
            <div class="card-actions">
              <span class="permissions-badge">نشط</span>
              <button class="btn-delete" onclick="deleteKey('${key}')">حذف</button>
            </div>
          `;
          keysList.appendChild(item);
        });
      } else {
        keysList.innerHTML = `<p style="text-align:center; color:#94a3b8;">لا توجد أكواد مضافة حالياً.</p>`;
      }
    });

    window.deleteKey = async (key) => {
      if (confirm(`هل أنت تأكد من حذف الكود: ${key}؟`)) {
        await remove(ref(db, 'keys/' + key));
      }
    };

    // --- 2. إدارة طلبات الانضمام (Accept Requests) ---
    const requestsList = document.getElementById("requestsList");

    onValue(ref(db, 'requests'), (snapshot) => {
      requestsList.innerHTML = "";
      const data = snapshot.val();
      if (data) {
        Object.keys(data).forEach(reqId => {
          const reqData = data[reqId];
          const item = document.createElement("div");
          item.className = "item-card";
          item.innerHTML = `
            <div>
              <strong>المستخدم:</strong> ${reqData.username || reqId}<br>
              <span style="font-size: 0.85rem; color: #94a3b8;">الكود المستخدم: ${reqData.code || 'غير متوفر'}</span>
            </div>
            <div class="card-actions">
              <button class="btn-accept" onclick="acceptRequest('${reqId}', '${reqData.username || reqId}')">قبول</button>
              <button class="btn-delete" onclick="deleteRequest('${reqId}')">رفض</button>
            </div>
          `;
          requestsList.appendChild(item);
        });
      } else {
        requestsList.innerHTML = `<p style="text-align:center; color:#94a3b8;">لا توجد طلبات جديدة حالياً.</p>`;
      }
    });

    window.acceptRequest = async (reqId, username) => {
      try {
        // نقل الطلب إلى جدول المستخدمين المقبولين
        await set(ref(db, 'users/' + reqId), {
          username: username,
          role: 'member',
          permissions: { notifications: false, manageKeys: false, createAccount: false },
          joinedAt: Date.now()
        });
        // حذف الطلب من قائمة الطلبات المعلقة
        await remove(ref(db, 'requests/' + reqId));
        alert(`تم قبول المستخدم ${username} بنجاح.`);
      } catch (err) {
        console.error("Error accepting request:", err);
      }
    };

    window.deleteRequest = async (reqId) => {
      if (confirm("هل أنت متأكد من رفض هذا الطلب؟")) {
        await remove(ref(db, 'requests/' + reqId));
      }
    };

    // --- 3. إدارة المستخدمين والصلاحيات ---
    const usersList = document.getElementById("usersList");

    onValue(ref(db, 'users'), (snapshot) => {
      usersList.innerHTML = "";
      const data = snapshot.val();
      if (data) {
        Object.keys(data).forEach(userKey => {
          const user = data[userKey];
          const item = document.createElement("div");
          item.className = "item-card";
          item.innerHTML = `
            <div>
              <strong>${user.username || userKey}</strong><br>
              <span style="font-size: 0.8rem; color: #38bdf8;">الدور: ${user.role || 'عضو'}</span>
            </div>
            <div class="card-actions">
              <button class="btn-edit" onclick="openEditPermissions('${userKey}', '${user.username || userKey}')">تعديل الصلاحيات</button>
              <button class="btn-delete" onclick="deleteUser('${userKey}')">حذف</button>
            </div>
          `;
          usersList.appendChild(item);
        });
      } else {
        usersList.innerHTML = `<p style="text-align:center; color:#94a3b8;">لا يوجد مستخدمين مسجلين حالياً.</p>`;
      }
    });

    window.openEditPermissions = function(userKey, username) {
      currentEditingUserKey = userKey;
      document.getElementById('editUsernameTarget').innerText = `المستخدم: ${username}`;
      
      // جلب الصلاحيات الحالية للمستخدم وضبط الـ Checkbox
      onValue(ref(db, `users/${userKey}/permissions`), (snapshot) => {
        const perms = snapshot.val() || {};
        document.getElementById('editPermNotifications').checked = !!perms.notifications;
        document.getElementById('editPermManageKeys').checked = !!perms.manageKeys;
        document.getElementById('editPermCreateAccount').checked = !!perms.createAccount;
      }, { onlyOnce: true });

      document.getElementById('editPermissionsModal').style.display = 'flex';
    };

    window.saveUserPermissions = async function() {
      if (!currentEditingUserKey) return;

      const newPerms = {
        notifications: document.getElementById('editPermNotifications').checked,
        manageKeys: document.getElementById('editPermManageKeys').checked,
        createAccount: document.getElementById('editPermCreateAccount').checked
      };

      try {
        await update(ref(db, `users/${currentEditingUserKey}/permissions`), newPerms);
        closeModal('editPermissionsModal');
        alert("تم تحديث الصلاحيات بنجاح!");
      } catch (err) {
        console.error("Error updating permissions:", err);
        alert("حدث خطأ أثناء حفظ الصلاحيات.");
      }
    };

    window.deleteUser = async (userKey) => {
      if (confirm("هل أنت متأكد من حذف هذا المستخدم من النظام؟")) {
        await remove(ref(db, 'users/' + userKey));
      }
    };

    // حماية الصفحة من فتح أدوات التطوير (Inspect Element)
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.onkeydown = function(e) {
      if (e.keyCode == 123 || 
          (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 67 || e.keyCode == 74)) || 
          (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83))) {
        return false;
      }
    };
  </script>
</body>
</html>
