<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - Nova State</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: #12161f; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .card { background: #1a2230; border: 1px solid #2a3447; padding: 35px; border-radius: 14px; width: 100%; max-width: 420px; box-shadow: 0 8px 25px rgba(0,0,0,0.4); position: relative; }
    h2 { color: #d4af37; text-align: center; margin-bottom: 25px; font-weight: 700; }
    .input-group { margin-bottom: 18px; text-align: right; }
    .input-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #cbd5e1; font-size: 0.95rem; }
    .input-group input { width: 100%; padding: 12px 15px; background: #12161f; border: 1px solid #2a3447; border-radius: 8px; color: #fff; outline: none; font-size: 1rem; transition: 0.3s; }
    .input-group input:focus { border-color: #d4af37; box-shadow: 0 0 8px rgba(212, 175, 55, 0.2); }
    .btn { width: 100%; padding: 12px; background: #d4af37; border: none; border-radius: 8px; color: #12161f; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn:hover { background: #e5be40; }
    .switch-text { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #94a3b8; }
    .switch-text span { color: #d4af37; cursor: pointer; font-weight: 600; text-decoration: underline; }
    
    /* تنبيهات داخلية في الموقع بديل عن alert جوجل */
    #siteToast {
      position: fixed;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      transition: all 0.4s ease;
      z-index: 9999;
      text-align: center;
      min-width: 280px;
    }
    #siteToast.show { bottom: 30px; }
    #siteToast.success { background: #16a34a; border: 1px solid #22c55e; }
    #siteToast.error { background: #dc2626; border: 1px solid #ef4444; }
  </style>
</head>
<body>

  <div class="card">
    <!-- تسجيل الدخول -->
    <div id="loginSection">
      <h2>تسجيل الدخول</h2>
      <div class="input-group">
        <label>اسم المستخدم</label>
        <input type="text" id="loginUser" placeholder="أدخل اسم المستخدم" autocomplete="off">
      </div>
      <div class="input-group">
        <label>كلمة المرور</label>
        <input type="password" id="loginPass" placeholder="أدخل كلمة المرور">
      </div>
      <button class="btn" onclick="handleLogin()">دخول 🚀</button>
      <div class="switch-text">ليس لديك حساب؟ <span onclick="toggleForms()">إنشاء طلب انضمام</span></div>
    </div>

    <!-- طلب انضمام -->
    <div id="registerSection" style="display: none;">
      <h2>طلب انضمام جديد</h2>
      <div class="input-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="regEmail" placeholder="example@gmail.com" autocomplete="off">
      </div>
      <div class="input-group">
        <label>اسم المستخدم</label>
        <input type="text" id="regUser" placeholder="اختر اسم مستخدم" autocomplete="off">
      </div>
      <div class="input-group">
        <label>كلمة المرور</label>
        <input type="password" id="regPass" placeholder="اختر كلمة مرور">
      </div>
      <button class="btn" onclick="submitRequest()">إرسال الطلب 📨</button>
      <div class="switch-text">لديك حساب بالفعل؟ <span onclick="toggleForms()">تسجيل الدخول</span></div>
    </div>
  </div>

  <!-- عنصر التنبيه المخصص داخل الموقع -->
  <div id="siteToast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB165FX1UTITowtK-il9rzIL_LwzfQwkpI",
      authDomain: "nova-state.firebaseapp.com",
      databaseURL: "https://nova-state-default-rtdb.firebaseio.com",
      projectId: "nova-state",
      storageBucket: "nova-state.firebasestorage.app",
      messagingSenderId: "478766533943",
      appId: "1:478766533943:web:6ce4d7cd0b1a58d72c1eb2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // دالة التنبيهات الداخلية داخل الموقع
    window.showToast = function(msg, isSuccess = false) {
      const toast = document.getElementById('siteToast');
      toast.innerText = msg;
      toast.className = 'show ' + (isSuccess ? 'success' : 'error');
      setTimeout(() => { toast.className = ''; }, 3500);
    };

    window.toggleForms = function() {
      const loginSec = document.getElementById('loginSection');
      const regSec = document.getElementById('registerSection');
      loginSec.style.display = loginSec.style.display === 'none' ? 'block' : 'none';
      regSec.style.display = regSec.style.display === 'none' ? 'block' : 'none';
    };

    // إرسال طلب انضمام
    window.submitRequest = async function() {
      const email = document.getElementById('regEmail').value.trim();
      const username = document.getElementById('regUser').value.trim();
      const pass = document.getElementById('regPass').value.trim();

      if (!email || !username || !pass) return showToast('يرجى كتابة كافة البيانات المطلوبة!');

      try {
        await push(ref(db, 'join_requests'), {
          email,
          username,
          pass,
          status: 'pending',
          createdAt: new Date().toISOString()
        });
        showToast('تم إرسال طلبك بنجاح! بانتظار رد الإدارة.', true);
        document.getElementById('regEmail').value = '';
        document.getElementById('regUser').value = '';
        document.getElementById('regPass').value = '';
        setTimeout(toggleForms, 2000);
      } catch (err) {
        showToast('حدث خطأ أثناء الإرسال: ' + err.message);
      }
    };

    // تسجيل الدخول
    window.handleLogin = async function() {
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value.trim();

      if (!user || !pass) return showToast('أدخل اسم المستخدم وكلمة المرور!');

      if (user === 'admin_manger' && pass === 'admin_manger@!') {
        localStorage.setItem('nova_user', JSON.stringify({
          username: 'المدير العام',
          role: 'owner'
        }));
        window.location.href = 'admin.html';
        return;
      }

      try {
        const dbRef = ref(getDatabase());
        const snapshot = await get(child(dbRef, 'users'));
        
        if (snapshot.exists()) {
          const users = snapshot.val();
          let foundUser = null;

          Object.keys(users).forEach(key => {
            if (users[key].username === user && users[key].pass === pass) {
              foundUser = users[key];
            }
          });

          if (foundUser) {
            localStorage.setItem('nova_user', JSON.stringify(foundUser));
            window.location.href = 'admin.html';
            return;
          }
        }
        showToast('بيانات الدخول غير صحيحة أو الحساب قيد المراجعة!');
      } catch (err) {
        showToast('خطأ بالاتصال: ' + err.message);
      }
    };
  </script>
</body>
</html>
