<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- 1. مكتبة تلوين الأكواد البرمجية (Highlight.js) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  
  <!-- 2. مكتبات ضغط وتحميل الملفات ZIP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: #0d1117; color: #e6edf3; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }

    /* --- شاشة الدخول بالكود --- */
    #authOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 17, 23, 0.96); backdrop-filter: blur(15px);
      display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px;
    }
    .auth-box {
      background: #161b22; border: 1px solid #30363d; padding: 40px; border-radius: 20px;
      width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .auth-box h2 { color: #d4af37; margin-bottom: 8px; font-weight: 800; font-size: 1.8rem; }
    .auth-box p { color: #8b949e; font-size: 0.9rem; margin-bottom: 25px; }
    .auth-box input {
      width: 100%; padding: 14px; background: #0d1117; border: 1px solid #30363d;
      border-radius: 12px; color: #fff; font-size: 1.1rem; text-align: center;
      outline: none; transition: 0.3s; margin-bottom: 20px; font-weight: 700; letter-spacing: 2px;
    }
    .auth-box input:focus { border-color: #d4af37; box-shadow: 0 0 12px rgba(212, 175, 55, 0.25); }
    .auth-box button {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #d4af37, #f39c12);
      border: none; border-radius: 12px; color: #0d1117; font-weight: 800;
      font-size: 1.05rem; cursor: pointer; transition: 0.3s;
    }
    .auth-box button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3); }

    /* --- الحاوية الرئيسية للشات في المنتصف --- */
    .app-container {
      width: 100%; max-width: 900px; height: 100vh; display: flex; flex-direction: column;
      background: #161b22; border-left: 1px solid #30363d; border-right: 1px solid #30363d;
    }

    /* الهيدر العلوي */
    .chat-header {
      background: #161b22; border-bottom: 1px solid #30363d; padding: 16px 25px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo { width: 38px; height: 38px; background: #d4af37; border-radius: 10px; display: flex; justify-content: center; align-items: center; color: #0d1117; font-weight: 900; font-size: 1.2rem; }
    .brand-title h3 { color: #fff; font-size: 1.05rem; font-weight: 700; }
    .brand-title span { color: #238636; font-size: 0.78rem; font-weight: 600; display: flex; align-items: center; gap: 5px; }
    .brand-title span::before { content: ''; width: 7px; height: 7px; background: #238636; border-radius: 50%; display: inline-block; }

    .user-info { display: flex; align-items: center; gap: 12px; }
    .code-badge { background: #0d1117; border: 1px dashed #d4af37; color: #d4af37; padding: 4px 10px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; }
    .logout-btn { background: rgba(248, 81, 73, 0.1); border: 1px solid #f85149; color: #f85149; padding: 5px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
    .logout-btn:hover { background: #f85149; color: #fff; }

    /* منطقة الشات */
    .chat-container { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
    .message { display: flex; gap: 14px; max-width: 90%; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.ai { align-self: flex-start; }

    .avatar { width: 35px; height: 35px; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-weight: 800; font-size: 0.85rem; flex-shrink: 0; }
    .message.user .avatar { background: #1f6feb; color: #fff; }
    .message.ai .avatar { background: #d4af37; color: #0d1117; }

    .msg-content {
      background: #0d1117; border: 1px solid #30363d; padding: 15px 20px;
      border-radius: 16px; line-height: 1.7; font-size: 0.98rem; white-space: pre-wrap; word-break: break-word;
    }
    .message.user .msg-content { background: #1f6feb; border-color: #388bfd; color: #fff; border-bottom-left-radius: 2px; }
    .message.ai .msg-content { border-bottom-right-radius: 2px; }

    /* تنسيق وتلوين الأكواد المتقدم */
    pre { margin-top: 12px; border-radius: 10px; overflow: hidden; direction: ltr; text-align: left; }
    pre code { font-family: 'Consolas', 'Monaco', monospace !important; font-size: 0.9rem; border-radius: 10px; padding: 14px !important; }

    /* زر تحميل ZIP المخصص */
    .download-zip-btn {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 15px; background: #238636;
      color: #fff; font-weight: 700; border: none; padding: 10px 18px; border-radius: 8px;
      cursor: pointer; font-size: 0.9rem; transition: 0.3s;
    }
    .download-zip-btn:hover { background: #2ea043; transform: translateY(-2px); }

    /* صندوق الإدخال السفلي */
    .input-wrapper { background: #161b22; border-top: 1px solid #30363d; padding: 20px 30px; }
    .chat-input-box { display: flex; gap: 12px; }
    .chat-input-box input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 12px; padding: 14px 20px; color: #fff; outline: none; font-size: 1rem; transition: 0.3s; }
    .chat-input-box input:focus { border-color: #d4af37; }
    .send-btn { background: #d4af37; border: none; border-radius: 12px; padding: 0 25px; color: #0d1117; font-weight: 800; cursor: pointer; transition: 0.2s; }
    .send-btn:hover { background: #e5be40; }

    #toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: #f85149; color: #fff; padding: 12px 25px; border-radius: 10px; font-weight: 700; transition: 0.3s; z-index: 2000; }
    #toast.show { bottom: 30px; }
  </style>
</head>
<body>

  <!-- شاشة الدخول بالكود -->
  <div id="authOverlay">
    <div class="auth-box">
      <h2>Nova AI</h2>
      <p>أدخل كود الاشتراك للبدء</p>
      <input type="text" id="accessCodeInput" placeholder="NOVA-XXXXX" autocomplete="off">
      <button onclick="loginWithCode()">دخول إلى الشات 🚀</button>
    </div>
  </div>

  <!-- الشات في المنتصف -->
  <div class="app-container">
    <div class="chat-header">
      <div class="brand">
        <div class="brand-logo">N</div>
        <div class="brand-title">
          <h3>مساعد Nova الذكي</h3>
          <span>متصل وجاهز للمحادثة والبرمجة</span>
        </div>
      </div>
      <div class="user-info">
        <span class="code-badge" id="activeCodeBadge">NOVA-XXXXX</span>
        <button class="logout-btn" onclick="logout()">خروج</button>
      </div>
    </div>

    <!-- منطقة الشات -->
    <div class="chat-container" id="chatContainer">
      <div class="message ai">
        <div class="avatar">AI</div>
        <div class="msg-content">أهلاً بك! 👋 كيف يمكنني مساعدتك اليوم؟ 
يمكننا السوالف والتحدث في أي موضوع، وإذا احتجت لكتابة كود أو سكريبت، فقط اطلبه مني وسأقوم ببرمجته وتلوينه وتجهيزه للتحميل بملف ZIP!</div>
      </div>
    </div>

    <!-- صندوق الإدخال السفلي -->
    <div class="input-wrapper">
      <div class="chat-input-box">
        <input type="text" id="userInput" placeholder="اكتب رسالتك أو طلبك هنا..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">إرسال 🚀</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB165FX1UTITowtK-il9rzIL_LwzfQwkpI",
      authDomain: "nova-state.firebaseapp.com",
      databaseURL: "https://nova-state-default-rtdb.firebaseio.com",
      projectId: "nova-state",
      storageBucket: "nova-state.firebasestorage.app",
      messagingSenderId: "478766533943",
      appId: "1:478766533943:web:6ce4d7cd0b1a58d72c1eb2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ⚠️ استبدل النص الإنجليزي بالأسفل بمفتاحك الحقيقي من Groq Console
    const GROQ_API_KEY = "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";

    let conversationHistory = [
      { 
        role: "system", 
        content: "أنت مساعد ذكي وصديق برمجيات. تحدث مع المستخدم بعفوية وودية حول أي موضوع يسألك عنه. إذا طلب منك كود برمي أو سكريبت (مثل Lua, HTML, Python, JS...)، قم بكتابة الكود كاملاً داخل كتل الكود المخصصة ```language مع تحديد اسم اللغة دائماً فوق الكود."
      }
    ];

    window.onload = function() {
      const savedCode = localStorage.getItem('active_client_code');
      if (savedCode) {
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('activeCodeBadge').innerText = savedCode;
      }
    };

    window.loginWithCode = async function() {
      const code = document.getElementById('accessCodeInput').value.trim();
      if (!code) return showToast('يرجى إدخال كود التفعيل!');

      try {
        const dbRef = ref(db);
        const snapshot = await get(child(dbRef, 'keys/' + code));

        if (snapshot.exists() && snapshot.val().active) {
          localStorage.setItem('active_client_code', code);
          document.getElementById('activeCodeBadge').innerText = code;
          document.getElementById('authOverlay').style.display = 'none';
        } else {
          showToast('الكود غير صحيح أو انتهت صلاحيته!');
        }
      } catch (err) {
        showToast('خطأ في الاتصال: ' + err.message);
      }
    };

    window.logout = function() {
      localStorage.removeItem('active_client_code');
      location.reload();
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.className = 'show';
      setTimeout(() => t.className = '', 3000);
    }

    window.sendMessage = async function() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      // حماية وتنظيف مفتاح API من أي رموز غريبة قد تسبب أخطاء
      const cleanApiKey = GROQ_API_KEY.replace(/[^\x00-\x7F]/g, "").trim();

      addMessage(text, 'user');
      input.value = '';

      conversationHistory.push({ role: "user", content: text });
      const typingId = addMessage('جاري التفكير والرد...', 'ai');

      try {
        const response = await fetch("[https://api.groq.com/openai/v1/chat/completions](https://api.groq.com/openai/v1/chat/completions)", {
          method: "POST",
          redirect: "follow",
          headers: {
            "Authorization": `Bearer ${cleanApiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: conversationHistory,
            temperature: 0.7
          })
        });

        if (!response.ok) {
          removeMessage(typingId);
          if (response.status === 401) {
            addMessage('خطأ (401): مفتاح Groq غير صحيح أو حُذف. انسخ مفتاحاً جديداً من console.groq.com.', 'ai');
          } else {
            addMessage(`خطأ من السيرفر (${response.status}): تأكد من مفتاح الـ API والاتصال.`, 'ai');
          }
          return;
        }

        const data = await response.json();
        removeMessage(typingId);

        if (data.choices && data.choices.length > 0) {
          const aiReply = data.choices[0].message.content;
          conversationHistory.push({ role: "assistant", content: aiReply });
          addMessage(aiReply, 'ai');
        } else {
          addMessage('حدث خطأ أثناء معالجة الطلب.', 'ai');
        }
      } catch (error) {
        removeMessage(typingId);
        addMessage('خطأ في الاتصال: ' + error.message, 'ai');
      }
    };

    window.handleKeyPress = function(e) {
      if (e.key === 'Enter') sendMessage();
    };

    function addMessage(text, sender) {
      const container = document.getElementById('chatContainer');
      const msgDiv = document.createElement('div');
      const msgId = 'msg-' + Date.now();
      msgDiv.id = msgId;
      msgDiv.className = `message ${sender}`;

      const avatar = sender === 'user' ? 'أنت' : 'AI';

      let formattedText = text.replace(/```(\w+)?\n([\s\S]*?)```/g, function(match, lang, code) {
        const validLang = lang ? lang : 'plaintext';
        return `<pre><code class="language-${validLang}">${escapeHtml(code.trim())}</code></pre>`;
      });

      msgDiv.innerHTML = `
        <div class="avatar">${avatar}</div>
        <div class="msg-content" id="content-${msgId}">${formattedText}</div>
      `;

      container.appendChild(msgDiv);

      // تلوين الأكواد بالوان البرمجة عبر Highlight.js
      msgDiv.querySelectorAll('pre code').forEach((block) => {
        hljs.highlightElement(block);
      });

      // إظهار زر الـ ZIP فقط عند إرسال كود برمج
      if (sender === 'ai' && text.includes('```')) {
        const contentDiv = document.getElementById(`content-${msgId}`);
        const zipBtn = document.createElement('button');
        zipBtn.className = 'download-zip-btn';
        zipBtn.innerHTML = '📦 تحميل الأكواد المكتوبة كـ ZIP';
        zipBtn.onclick = () => downloadCodeAsZip(text);
        contentDiv.appendChild(zipBtn);
      }

      container.scrollTop = container.scrollHeight;
      return msgId;
    }

    function removeMessage(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // ضغط وتحميل الأكواد
    window.downloadCodeAsZip = function(rawText) {
      const zip = new JSZip();
      const codeBlockRegex = /```(?:(\w+)\n)?([\s\S]*?)```/g;
      let match;
      let fileIndex = 1;

      while ((match = codeBlockRegex.exec(rawText)) !== null) {
        let lang = (match[1] || 'txt').toLowerCase();
        let codeContent = match[2].trim();

        let ext = lang;
        if (lang === 'javascript' || lang === 'js') ext = 'js';
        else if (lang === 'python' || lang === 'py') ext = 'py';
        else if (lang === 'html') ext = 'html';
        else if (lang === 'css') ext = 'css';
        else if (lang === 'lua') ext = 'lua';

        let filename = `script_${fileIndex}.${ext}`;
        if (ext === 'html' && fileIndex === 1) filename = 'index.html';

        zip.file(filename, codeContent);
        fileIndex++;
      }

      zip.generateAsync({ type: "blob" }).then(function(content) {
        saveAs(content, "project_files.zip");
        showToast('تم تحميل ملف الـ ZIP بنجاح! 📦');
      });
    };
  </script>
</body>
</html>
