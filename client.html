<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI - العميل المتطور</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: #0d1117; color: #e6edf3; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }

    /* شاشة الدخول */
    #authOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 17, 23, 0.98); backdrop-filter: blur(15px);
      display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px;
    }
    .auth-box {
      background: #161b22; border: 1px solid #30363d; padding: 40px; border-radius: 20px;
      width: 100%; max-width: 420px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .auth-box h2 { color: #d4af37; margin-bottom: 8px; font-weight: 800; font-size: 1.8rem; }
    .auth-box p { color: #8b949e; font-size: 0.9rem; margin-bottom: 20px; }
    .auth-box input {
      width: 100%; padding: 14px; background: #0d1117; border: 1px solid #30363d;
      border-radius: 12px; color: #fff; font-size: 1.1rem; text-align: center;
      outline: none; transition: 0.3s; margin-bottom: 15px; font-weight: 700; text-transform: uppercase;
    }
    .auth-box input:focus { border-color: #d4af37; box-shadow: 0 0 12px rgba(212, 175, 55, 0.25); }
    .auth-box button {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #d4af37, #f39c12);
      border: none; border-radius: 12px; color: #0d1117; font-weight: 800;
      font-size: 1.05rem; cursor: pointer; transition: 0.3s;
    }
    .auth-box button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3); }

    .app-container {
      width: 100%; max-width: 900px; height: 100vh; display: flex; flex-direction: column;
      background: #161b22; border-left: 1px solid #30363d; border-right: 1px solid #30363d;
    }

    .chat-header {
      background: #161b22; border-bottom: 1px solid #30363d; padding: 16px 25px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo { width: 38px; height: 38px; background: #d4af37; border-radius: 10px; display: flex; justify-content: center; align-items: center; color: #0d1117; font-weight: 900; font-size: 1.2rem; }
    .brand-title h3 { color: #fff; font-size: 1.05rem; font-weight: 700; }
    .brand-title span { color: #238636; font-size: 0.78rem; font-weight: 600; display: flex; align-items: center; gap: 5px; }
    .brand-title span::before { content: ''; width: 7px; height: 7px; background: #238636; border-radius: 50%; display: inline-block; }

    .user-info { display: flex; align-items: center; gap: 10px; }
    .code-badge { background: #0d1117; border: 1px dashed #d4af37; color: #d4af37; padding: 4px 10px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; }
    .time-badge { background: #1f6feb; color: #fff; padding: 4px 10px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; }

    .chat-container { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 20px; }
    .message { display: flex; gap: 14px; max-width: 92%; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.ai { align-self: flex-start; }

    .avatar { width: 36px; height: 36px; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-weight: 800; font-size: 0.85rem; flex-shrink: 0; }
    .message.user .avatar { background: #1f6feb; color: #fff; }
    .message.ai .avatar { background: #d4af37; color: #0d1117; }

    .msg-content {
      background: #0d1117; border: 1px solid #30363d; padding: 15px 20px;
      border-radius: 16px; line-height: 1.7; font-size: 0.98rem; word-break: break-word; flex: 1;
    }
    .message.user .msg-content { background: #1f6feb; border-color: #388bfd; color: #fff; border-bottom-left-radius: 2px; }
    .message.ai .msg-content { border-bottom-right-radius: 2px; }

    .msg-image { max-width: 200px; max-height: 200px; border-radius: 8px; margin-bottom: 10px; display: block; border: 1px solid #30363d; }

    .code-block-wrapper {
      margin-top: 12px; border: 1px solid #30363d; border-radius: 10px; overflow: hidden; background: #161b22; direction: ltr; text-align: left;
    }
    .code-header {
      background: #21262d; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; font-family: monospace; font-size: 0.85rem; color: #8b949e;
    }
    .code-actions { display: flex; gap: 8px; }
    .code-btn {
      background: #30363d; border: none; color: #c9d1d9; padding: 4px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; transition: 0.2s; font-family: 'Cairo', sans-serif; font-weight: 600;
    }
    .code-btn:hover { background: #8b949e; color: #0d1117; }
    
    pre { margin: 0; }
    pre code { font-family: 'Consolas', 'Monaco', monospace !important; font-size: 0.9rem; padding: 15px !important; }

    .download-zip-btn {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 15px; background: #238636;
      color: #fff; font-weight: 700; border: none; padding: 10px 18px; border-radius: 8px;
      cursor: pointer; font-size: 0.9rem; transition: 0.3s;
    }
    .download-zip-btn:hover { background: #2ea043; transform: translateY(-2px); }

    .input-wrapper { background: #161b22; border-top: 1px solid #30363d; padding: 20px 25px; }
    .chat-input-box { display: flex; gap: 12px; align-items: center; }
    .chat-input-box input[type="text"] { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 12px; padding: 14px 20px; color: #fff; outline: none; font-size: 1rem; transition: 0.3s; }
    .chat-input-box input[type="text"]:focus { border-color: #d4af37; }
    
    .upload-btn-label {
      background: #21262d; border: 1px solid #30363d; border-radius: 12px; padding: 12px 15px;
      color: #c9d1d9; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: 0.2s;
    }
    .upload-btn-label:hover { background: #30363d; color: #d4af37; }

    .send-btn { background: #d4af37; border: none; border-radius: 12px; padding: 14px 25px; color: #0d1117; font-weight: 800; cursor: pointer; transition: 0.2s; }
    .send-btn:hover { background: #e5be40; }

    #filePreviewIndicator { font-size: 0.8rem; color: #38bdf8; margin-top: 6px; display: none; }

    #toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: #f85149; color: #fff; padding: 12px 25px; border-radius: 10px; font-weight: 700; transition: 0.3s; z-index: 2000; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
    #toast.show { bottom: 30px; }
  </style>
</head>
<body>

  <!-- شاشة الدخول الإجبارية للكود -->
  <div id="authOverlay">
    <div class="auth-box">
      <h2>Nova AI</h2>
      <p>أدخل كود التفعيل المأخوذ من لوحة الأدمن</p>
      <input type="text" id="accessCodeInput" placeholder="مثال: NOVA-XXXXX">
      <button onclick="validateAndLogin()">دخول 🚀</button>
    </div>
  </div>

  <div class="app-container">
    <div class="chat-header">
      <div class="brand">
        <div class="brand-logo">N</div>
        <div class="brand-title">
          <h3>مساعد Nova الذكي</h3>
          <span>متصل وجاهز للمحادثة، قراءة الصور والملفات والبرمجة</span>
        </div>
      </div>
      <div class="user-info">
        <span class="code-badge" id="activeCodeBadge">---</span>
        <span class="time-badge" id="timeRemainingBadge">متبقي: --</span>
      </div>
    </div>

    <div class="chat-container" id="chatContainer">
      <div class="message ai">
        <div class="avatar">AI</div>
        <div class="msg-content" id="welcomeMsg">أهلاً بك 👋 يمكنك إرسال رسائل، رفع صور لتحليلها، أو إرفاق ملفات وبرمجة ما تريد!</div>
      </div>
    </div>

    <div class="input-wrapper">
      <div id="filePreviewIndicator">📁 تم إرفاق ملف: <span id="fileNameDisplay"></span></div>
      <div class="chat-input-box">
        <input type="file" id="fileInput" style="display: none;" onchange="handleFileSelect(event)" accept="image/*,.txt,.js,.py,.html,.css,.json">
        <label for="fileInput" class="upload-btn-label" title="رفع صورة أو ملف">📎</label>
        
        <input type="text" id="userInput" placeholder="اكتب رسالتك أو اطلب سكربت معين..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">إرسال 🚀</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB165FX1UTITowtK-il9rzIL_LwzfQwkpI",
      authDomain: "nova-state.firebaseapp.com",
      databaseURL: "https://nova-state-default-rtdb.firebaseio.com",
      projectId: "nova-state",
      storageBucket: "nova-state.firebasestorage.app",
      messagingSenderId: "478766533943",
      appId: "1:478766533943:web:6ce4d7cd0b1a58d72c1eb2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const k1 = "gsk_ZdkWYQEtGqeJJDrtrrgq";
    const k2 = "WGdyb3FY3patS54YhxytqNnHu65sGCCV";
    const GROQ_API_KEY = k1 + k2;

    let conversationHistory = [
      { role: "system", content: "أنت مساعد ذكي واسمه Nova AI. قم بالرد باللغة العربية. عند كتابة كود برمجياً، حدد اسم اللغة في بداية كل كتلة كود، واقترح اسماً ذابتاً ومعبراً للمشروع أو السكربت الطلب." }
    ];

    let attachedFileContent = null;
    let attachedFileType = null;
    let attachedFileName = "";

    window.onload = function() {
      const activeCode = localStorage.getItem('nova_user_code');
      if (activeCode) {
        checkCodeStatus(activeCode, true);
      }
    };

    window.validateAndLogin = async function() {
      const inputCode = document.getElementById('accessCodeInput').value.trim().toUpperCase();
      if (!inputCode) return showToast('يرجى إدخال الكود أولاً!');
      await checkCodeStatus(inputCode, false);
    }

    async function checkCodeStatus(code, isAutoLogin) {
      try {
        const keyRef = ref(db, 'keys/' + code);
        const snapshot = await get(keyRef);

        if (!snapshot.exists()) {
          showToast('الكود المدخل غير صحيح أو غير مسجل!');
          if (isAutoLogin) logout();
          return;
        }

        const foundData = snapshot.val();
        const now = Date.now();

        if (foundData.expireAt && now > foundData.expireAt) {
          showToast('عفواً، لقد انتهت صلاحية هذا الكود!');
          if (isAutoLogin) logout();
          return;
        }

        const diffMs = foundData.expireAt ? (foundData.expireAt - now) : (30 * 24 * 60 * 60 * 1000);
        const hoursLeft = Math.floor(diffMs / (1000 * 60 * 60));
        const daysLeft = Math.floor(hoursLeft / 24);

        let timeLeftStr = daysLeft > 0 ? `${daysLeft} يوم` : `${hoursLeft} ساعة`;

        localStorage.setItem('nova_user_code', code);
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('activeCodeBadge').innerText = code;
        document.getElementById('timeRemainingBadge').innerText = `متبقي: ${timeLeftStr}`;
        document.getElementById('welcomeMsg').innerText = `اهلا بك في Nova Ai نقدر نسلعدك و كل شيء`;

      } catch (err) {
        console.error(err);
        showToast('حدث خطأ أثناء الاتصال بقاعدة البيانات.');
      }
    }

    window.logout = function() {
      localStorage.removeItem('nova_user_code');
      document.getElementById('authOverlay').style.display = 'flex';
    }

    window.showToast = function(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.className = 'show';
      setTimeout(() => t.className = '', 3000);
    }

    // إدارة رفع الملفات والصور
    window.handleFileSelect = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      attachedFileName = file.name;
      const reader = new FileReader();

      if (file.type.startsWith('image/')) {
        reader.onload = function(e) {
          attachedFileContent = e.target.result; // Base64 للصورة
          attachedFileType = 'image';
          showFileIndicator(file.name);
        };
        reader.readAsDataURL(file);
      } else {
        reader.onload = function(e) {
          attachedFileContent = e.target.result; // محتوى النص للملف
          attachedFileType = 'text';
          showFileIndicator(file.name);
        };
        reader.readAsText(file);
      }
    }

    function showFileIndicator(name) {
      const ind = document.getElementById('filePreviewIndicator');
      document.getElementById('fileNameDisplay').innerText = name;
      ind.style.display = 'block';
    }

    window.sendMessage = async function() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text && !attachedFileContent) return;

      let displayHtml = text ? escapeHtml(text).replace(/\n/g, '<br>') : '';
      let apiUserContent = text;

      // معالجة إذا تم إرفاق صورة
      if (attachedFileType === 'image') {
        displayHtml = `<img src="${attachedFileContent}" class="msg-image"><br>` + displayHtml;
        apiUserContent = [
          { type: "text", text: text || "قم بتحليل هذه الصورة وقراءتها بالتفصيل." },
          { type: "image_url", image_url: { url: attachedFileContent } }
        ];
      } 
      // معالجة إذا تم إرفاق ملف نصي أو كود
      else if (attachedFileType === 'text') {
        apiUserContent = `${text}\n\n[محتوى الملف المُرفق (${attachedFileName}):\n${attachedFileContent}]`;
        displayHtml += `<br><small style="color: #38bdf8;">📁 [ملف مرفق: ${attachedFileName}]</small>`;
      }

      addMessageCustom(displayHtml, 'user');
      input.value = '';

      // إعادة تعيين المرفقات بعد الإرسال
      document.getElementById('fileInput').value = '';
      document.getElementById('filePreviewIndicator').style.display = 'none';
      const currentFileContent = attachedFileContent;
      const currentFileType = attachedFileType;
      attachedFileContent = null;
      attachedFileType = null;
      attachedFileName = "";

      conversationHistory.push({ role: "user", content: apiUserContent });
      const typingId = addMessage('جاري المراجعة ....!', 'ai');

      try {
        // استخدام Llama 3.2 90b Vision إذا كانت مرفقة صورة، أو النموذج العادي للنصوص والسكربتات
        const selectedModel = (currentFileType === 'image') ? "llama-3.2-90b-vision-preview" : "llama-3.3-70b-versatile";

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + GROQ_API_KEY
          },
          body: JSON.stringify({
            model: selectedModel,
            messages: conversationHistory,
            temperature: 0.6
          })
        });

        if (!response.ok) {
          removeMessage(typingId);
          showToast(`خطأ في الاستجابة (${response.status})`);
          return;
        }

        const data = await response.json();
        removeMessage(typingId);

        if (data.choices && data.choices.length > 0) {
          const aiReply = data.choices[0].message.content;
          conversationHistory.push({ role: "assistant", content: aiReply });
          addMessage(aiReply, 'ai');
        }
      } catch (error) {
        removeMessage(typingId);
        showToast('خطأ بالاتصال: ' + error.message);
      }
    }

    window.handleKeyPress = function(e) { if (e.key === 'Enter') sendMessage(); }

    function addMessage(text, sender) {
      return addMessageCustom(formatAiText(text), sender, text);
    }

    function addMessageCustom(htmlContent, sender, rawOriginalText = "") {
      const container = document.getElementById('chatContainer');
      const msgDiv = document.createElement('div');
      const msgId = 'msg-' + Date.now();
      msgDiv.id = msgId;
      msgDiv.className = `message ${sender}`;

      const avatar = sender === 'user' ? 'أنت' : 'AI';
      let processedText = htmlContent;
      let hasCodeBlocks = false;

      if (sender === 'ai' && typeof htmlContent === 'string' && htmlContent.includes('```')) {
        hasCodeBlocks = true;
        let blockCount = 0;
        processedText = htmlContent.replace(/```(\w+)?\n([\s\S]*?)```/g, function(match, lang, code) {
          blockCount++;
          const validLang = lang ? lang.toLowerCase() : 'txt';
          const codeId = `code-${msgId}-${blockCount}`;
          window[codeId] = code.trim();

          return `
            <div class="code-block-wrapper">
              <div class="code-header">
                <span>${validLang.toUpperCase()}</span>
                <div class="code-actions">
                  <button class="code-btn" onclick="copyCode('${codeId}')">نسخ الكود</button>
                  <button class="code-btn" onclick="downloadSingleFile('${codeId}', '${validLang}')">تنزيل</button>
                </div>
              </div>
              <pre><code class="language-${validLang}">${escapeHtml(code.trim())}</code></pre>
            </div>
          `;
        });
      } else if (sender === 'ai') {
        processedText = escapeHtml(htmlContent).replace(/\n/g, '<br>');
      }

      msgDiv.innerHTML = `
        <div class="avatar">${avatar}</div>
        <div class="msg-content" id="content-${msgId}">${processedText}</div>
      `;

      container.appendChild(msgDiv);

      msgDiv.querySelectorAll('pre code').forEach((block) => {
        hljs.highlightElement(block);
      });

      if (sender === 'ai' && hasCodeBlocks) {
        const contentDiv = document.getElementById(`content-${msgId}`);
        const zipBtn = document.createElement('button');
        zipBtn.className = 'download-zip-btn';
        zipBtn.innerHTML = '📦 تحميل الملفات كـ ZIP (تسمية ذكية)';
        
        // استخلاص اسم ذكي للـ ZIP بناءً على محتوى رسالة المستخدم الأخيرة أو الطلب
        zipBtn.onclick = () => downloadCodeAsZip(rawOriginalText);
        contentDiv.appendChild(zipBtn);
      }

      container.scrollTop = container.scrollHeight;
      return msgId;
    }

    function formatAiText(text) {
      if (!text) return '';
      if (text.includes('```')) return text;
      return escapeHtml(text).replace(/\n/g, '<br>');
    }

    function removeMessage(id) { const el = document.getElementById(id); if (el) el.remove(); }
    function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    window.copyCode = function(codeId) {
      const codeText = window[codeId];
      if (codeText) {
        navigator.clipboard.writeText(codeText);
        showToast('تم نسخ الكود بنجاح! 📋');
      }
    };

    window.downloadSingleFile = function(codeId, lang) {
      const codeText = window[codeId];
      if (!codeText) return;

      let ext = lang;
      if (lang === 'javascript' || lang === 'js') ext = 'js';
      else if (lang === 'python' || lang === 'py') ext = 'py';
      else if (lang === 'html') ext = 'html';
      else if (lang === 'css') ext = 'css';

      const blob = new Blob([codeText], { type: "text/plain;charset=utf-8" });
      saveAs(blob, `script.${ext}`);
    };

    // ميزة تسمية ملف الـ ZIP بناءً على نوع السكربت أو طلب المستخدم
    function downloadCodeAsZip(rawText) {
      const zip = new JSZip();
      const codeBlockRegex = /```(?:(\w+)\n)?([\s\S]*?)```/g;
      let match;
      let fileIndex = 1;

      // محاولة استنتاج اسم ذكي من سجل المحادثة أو الكود المولد
      let projectBaseName = "nova_script";
      const lastUserMsg = conversationHistory.filter(m => m.role === 'user').pop();
      if (lastUserMsg && typeof lastUserMsg.content === 'string') {
        // استخراج أول كلمتين أو ثلاث صالحة لتكون اسماً للملف وتنظيفها من الرموز
        let cleanName = lastUserMsg.content.replace(/[^\w\sà-ÿا-ي]/gi, '').trim().split(/\s+/).slice(0, 3).join('_');
        if (cleanName.length > 2) {
          projectBaseName = cleanName;
        }
      }

      while ((match = codeBlockRegex.exec(rawText)) !== null) {
        let lang = (match[1] || 'txt').toLowerCase();
        let codeContent = match[2].trim();

        let ext = lang;
        if (lang === 'javascript' || lang === 'js') ext = 'js';
        else if (lang === 'python' || lang === 'py') ext = 'py';
        else if (lang === 'html') ext = 'html';
        else if (lang === 'css') ext = 'css';

        let filename = `${projectBaseName}_file_${fileIndex}.${ext}`;
        if (ext === 'html' && fileIndex === 1) filename = `${projectBaseName}.html`;

        zip.file(filename, codeContent);
        fileIndex++;
      }

      zip.generateAsync({ type: "blob" }).then(function(content) {
        saveAs(content, `${projectBaseName}_project.zip`);
      });
    }
  </script>
</body>
</html>
