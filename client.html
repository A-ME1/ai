<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة المشتركين - Nova State</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --text-color: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: #334155;
      --danger-color: #f87171;
      --success-color: #4ade80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    h2 {
      color: var(--accent-color);
      text-align: center;
      margin-bottom: 20px;
      font-size: 22px;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: right;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent-color);
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-hover);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 10px;
    }

    button:hover {
      background-color: #0369a1;
    }

    .status-msg {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }

    .error { color: var(--danger-color); }
    .success { color: var(--success-color); }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>تسجيل دخول المشتركين</h2>
    <form id="loginForm">
      <div class="input-group">
        <label for="userKey">كود الاشتراك الخاص بك:</label>
        <input type="text" id="userKey" placeholder="أدخل كود الاشتراك" required autocomplete="off">
      </div>
      <button type="submit" id="loginBtn">دخول</button>
    </form>
    <div id="statusMsg" class="status-msg"></div>

    <div id="aiDashboard" class="hidden" style="margin-top: 20px;">
      <hr style="border-color: var(--border-color); margin: 20px 0;">
      <h2>مساعد الذكاء الاصطناعي</h2>
      <div class="input-group">
        <label for="aiPrompt">اسأل المساعد الذكي:</label>
        <textarea id="aiPrompt" rows="3" placeholder="اكتب سؤالك هنا..."></textarea>
      </div>
      <button id="sendAiBtn">إرسال الطلب</button>
      <div id="aiResponse" style="margin-top: 15px; background: var(--bg-color); padding: 10px; border-radius: 8px; font-size: 14px; white-space: pre-wrap;"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB165FX1UTITowtK-il9rzIL_LwzfQwkpI",
      authDomain: "nova-state.firebaseapp.com",
      databaseURL: "https://nova-state-default-rtdb.firebaseio.com",
      projectId: "nova-state",
      storageBucket: "nova-state.firebasestorage.app",
      messagingSenderId: "478766533943",
      appId: "1:478766533943:web:6ce4d7cd0b1a58d72c1eb2",
      measurementId: "G-LMCRPZT1DV"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);

    const loginForm = document.getElementById("loginForm");
    const statusMsg = document.getElementById("statusMsg");
    const aiDashboard = document.getElementById("aiDashboard");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const keyInput = document.getElementById("userKey").value.trim();
      
      statusMsg.className = "status-msg";
      statusMsg.textContent = "جاري التحقق من الكود...";

      if (!keyInput) {
        statusMsg.className = "status-msg error";
        statusMsg.textContent = "يرجى كتابة كود الاشتراك!";
        return;
      }

      try {
        const snapshot = await get(ref(db, 'keys/' + keyInput));
        if (snapshot.exists()) {
          const data = snapshot.val();
          if (data.active) {
            statusMsg.className = "status-msg success";
            statusMsg.textContent = "تم تسجيل الدخول بنجاح!";
            aiDashboard.classList.remove("hidden");
          } else {
            statusMsg.className = "status-msg error";
            statusMsg.textContent = "هذا الكود معطل أو منتهي الصلاحية.";
            aiDashboard.classList.add("hidden");
          }
        } else {
          statusMsg.className = "status-msg error";
          statusMsg.textContent = "الكود الذي أدخلته غير موجود!";
          aiDashboard.classList.add("hidden");
        }
      } catch (err) {
        console.error("Firebase Auth Error:", err);
        statusMsg.className = "status-msg error";
        statusMsg.textContent = "حدث خطأ أثناء الاتصال بالقاعدة.";
      }
    });

    const sendAiBtn = document.getElementById("sendAiBtn");
    const aiPrompt = document.getElementById("aiPrompt");
    const aiResponse = document.getElementById("aiResponse");

    sendAiBtn.addEventListener("click", () => {
      const prompt = aiPrompt.value.trim();
      if (!prompt) return alert("اكتب سؤالاً أولاً!");
      
      aiResponse.textContent = "جاري المعالجة...";
      setTimeout(() => {
        aiResponse.textContent = "تم استلام سؤالك: (" + prompt + ")\nهذه استجابة تجريبية ناتجة من النظام المفعل بنجاح!";
      }, 1000);
    });
  </script>
</body>
</html>
